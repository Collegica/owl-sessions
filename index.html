<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OWL Sessions</title>
  <meta name="theme-color" content="#3A4366">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/tokens.css">
  <style>main { max-width: 72rem; }</style>
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <main>
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">OWL Sessions</h1>
    <owl-sessions></owl-sessions>
  </main>
  <script type="module">
    // Offline and installable when run on its own. The site's page that embeds
    // the app does not register this; only this full-screen page does.
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
